<!doctype html>
<html lang="en">
<head>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta charset="utf-8" />
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dublikata Studio</title>
<style>
        body {
            font-family: 'Inter', -apple-system, sans-serif;
        }

        @font-face {
            font-family: 'Inter';
            src: url('./fonts/Inter.ttf') format('truetype');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }

        * { box-sizing: border-box; }

        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s;
            overflow: hidden;
        }

        .loader-content {
            text-align: center;
        }

        .studio-logo {
            color: #ffffff;
            font-size: 2.5rem;
            letter-spacing: 4px;
            margin-bottom: 20px;
            font-family: 'Inter', -apple-system, sans-serif;
            text-transform: uppercase;
            animation: fadeIn 1.5s ease-out;
        }

        .studio-logo span {
            color: #007bff;
        }

        .progress-bar-container {
            width: 400px;
            height: 4px;
            background: #1a1a1a;
            border-radius: 10px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }

        .progress-fill-XP {
            width: 50px;
            height: 100%;
            background: #007bff;
            border-radius: 10px;
            box-shadow: 0 0 15px #007bff, 0 0 5px white inset;
            position: absolute;
            left: -55px;
            animation: loadingXP 1.5s cubic-bezier(0.45, 0.05, 0.55, 0.95) forwards;
            animation-iteration-count: 3;
        }

        @keyframes loadingXP {
            0% { left: -110px; }
            100% { left: 100%; }
        }

        .loader-hidden {
            opacity: 0;
            visibility: hidden;
        }

        .main-content {
            padding: 20px;
            color: white;
            font-family: 'Inter', -apple-system, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        .explorer-header {
            padding: 15px 20px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 1px;
        }


.editor-header {
    background: #111;
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #1a1a1a;
    font-size: 0.8rem;
    color: #888;
}

.studio-workspace {
    display: flex;
    height: 100vh;
    padding: 20px;
    gap: 20px;
    background: transparent;
}

.file-explorer {
    width: 300px;
    background: rgba(15, 15, 15, 0.95);
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    overflow: hidden;
}

.code-editor-area {
    flex-grow: 1;
    background: rgba(15, 15, 15, 0.95);
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

#editor {
    flex-grow: 1;
    background: transparent;
    color: #eee;
    border: none;
    padding: 25px;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 16px;
    outline: none;
    resize: none;
}

#save-btn {
    background: #007bff;
    border-radius: 12px;
    padding: 10px 20px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: 0.3s;
}

.file-explorer {
    width: 280px;
    background: #0f0f0f;
    border-radius: 16px;
    border: 1px solid #1a1a1a;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.code-editor-area {
    flex-grow: 1;
    background: #0f0f0f;
    border-radius: 16px;
    border: 1px solid #1a1a1a;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.editor-header, .explorer-header {
    background: #151515;
    border-bottom: 1px solid #1a1a1a;
    padding: 15px 20px;
}

        .file-list {
            list-style: none;
            padding: 0;
            margin: 0;
            flex-grow: 1;
        }

        .file-item {
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            color: #ccc;
            transition: background 0.2s, color 0.2s;
        }

.file-item img {
    width: 16px;
    height: 16px;
}

.file-item:hover {
    background: #1a1a1a;
    color: #fff;
}

.file-item.active {
    background: #1a1a1a;
    color: #007bff;
    border-left: 2px solid #007bff;
}

.explorer-actions {
    padding: 20px;
    border-top: 1px solid #1a1a1a;
}

.add-file-btn {
    width: 100%;
    padding: 10px;
    background: transparent;
    border: 1px dashed #333;
    color: #666;
    border-radius: 5px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: 0.3s;
}

.add-file-btn:hover {
    border-color: #007bff;
    color: #007bff;
}

.editor-placeholder {
    color: #333;
    font-size: 1.2rem;
}

#save-btn:hover {
    background: #0056b3;
    box-shadow: 0 0 10px rgba(0, 123, 255, 0.4);
}

#project-name {
    background: transparent;
    border: none;
    color: #007bff;
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    text-transform: uppercase;
    outline: none;
    width: 100%;
    cursor: pointer;
    transition: color 0.2s;
}

#project-name:focus {
    color: #fff;
    cursor: text;
}

#music-player-bar {
    background: rgba(17, 17, 17, 0.9);
    backdrop-filter: blur(10px);  
    border: 1px solid #333;
    padding: 12px 20px;
    position: absolute;
    bottom: 15px;   
    left: 15px;    
    right: 15px;  
    display: none; 
    align-items: center;
    gap: 15px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    z-index: 100;
}

.shifted {
    padding-bottom: 80px !important; 
}
    </style>
</head>
<body style="background-color: #050505; margin: 0;">

    <div id="loader">
        <div class="loader-content">
            <h1 class="studio-logo">DUBLIKATA <span>STUDIO</span></h1>
            <div class="progress-bar-container">
                <div class="progress-fill-XP"></div>
            </div>
        </div>
    </div>

<div class="studio-workspace">
    <aside class="file-explorer">
        <div class="explorer-header">
            <span>ПРОЕКТ:</span>
            <input type="text" id="project-name" value="DUBLIKATA" spellcheck="false">
        </div>
        
<ul class="file-list" id="file-list"></ul>
        
<div class="explorer-actions">
    <button class="add-file-btn" onclick="document.getElementById('real-file-input').click()">
        + Добавить файл
    </button>
    <input type="file" id="real-file-input" style="display: none;" multiple>
</div>
    </aside>

    <main class="code-editor-area">
        <div class="editor-header">
            <span id="current-filename">index.html</span>
            <button id="save-btn">Сохранить на GitHub</button>
        </div>
        <div id="image-preview" style="display: none; justify-content: center; align-items: center; height: 100%; overflow: auto;">
            <img id="preview-img" src="" style="max-width: 90%; max-height: 90%; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.5);">
        </div>
        <div id="music-player-bar" style="display: none; background: #111; border-top: 1px solid #333; padding: 10px; position: absolute; bottom: 0; left: 0; right: 0; align-items: center; gap: 15px; border-radius: 0 0 15px 15px;">
            <span id="track-name" style="color: #007bff; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px;">Track.mp3</span>
            <audio id="main-audio" controls style="height: 30px; flex-grow: 1; filter: invert(100%) hue-rotate(180deg) brightness(1.5);"></audio>
        </div>
        <div id="lyrics-container" style="display: none; position: absolute; bottom: 85px; left: 15px; right: 15px; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); color: #fff; padding: 15px; border-radius: 10px; text-align: center; font-family: 'JetBrains Mono', monospace; z-index: 99; border: 1px solid #333;">
            <p id="lyrics-text" style="margin: 0; font-size: 14px; color: #007bff;">Ожидание текста песни...</p>
        </div>
        <textarea id="editor" spellcheck="false"></textarea>
    </main>
</div>

<script>
const audio = new Audio();
const dbRequest = indexedDB.open("DublikataDB", 1);
let db;

dbRequest.onupgradeneeded = (e) => {
    db = e.target.result;
    if (!db.objectStoreNames.contains("files")) {
        db.createObjectStore("files");
    }
};

dbRequest.onsuccess = (e) => {
    db = e.target.result;
    loadFilesFromDB(); 
};

function saveFileToDB(name, data) {
    const transaction = db.transaction(["files"], "readwrite");
    const store = transaction.objectStore("files");
    store.put(data, name);
}

function loadFilesFromDB() {
    const transaction = db.transaction(["files"], "readonly");
    const store = transaction.objectStore("files");
    const request = store.getAll();
    const keysRequest = store.getAllKeys();

    request.onsuccess = () => {
        keysRequest.onsuccess = () => {
            const keys = keysRequest.result;
            const values = request.result;
            keys.forEach((key, i) => {
                filesData[key] = values[i];
            });
            renderFileList();
        };
    };
}

function saveToStorage() {
    try {
        const dataToSave = {};
        for (let key in filesData) {
            if (typeof filesData[key] === 'string' && !filesData[key].startsWith('blob:')) {
                dataToSave[key] = filesData[key];
            }
        }
        localStorage.setItem('dublikata_files', JSON.stringify(dataToSave));
        console.log("Данные успешно сохранены в БД");
    } catch (e) {
        console.error("Критическая ошибка сохранения:", e);
    }
}

const lyricsContainer = document.getElementById('lyrics-container');
const lyricsText = document.getElementById('lyrics-text');

let filesData = JSON.parse(localStorage.getItem('dublikata_files')) || {};

if (Object.keys(filesData).length === 0) {
    filesData["readme.txt"] = "Добро пожаловать в Dublikata Studio!\nПеретащи сюда свои файлы проекта.";
}

const fileList = document.getElementById('file-list');
const editorTextArea = document.getElementById('editor');
const currentFileNameDisplay = document.getElementById('current-filename');
const explorer = document.querySelector('.file-explorer');
const projectInput = document.getElementById('project-name');

function renderFileList() {
    fileList.innerHTML = '';
    Object.keys(filesData).forEach(fileName => {
        const li = document.createElement('li');
        const isActive = currentFileNameDisplay.innerText === fileName;
        li.className = 'file-item' + (isActive ? ' active' : '');

        const iconUrl = getFileIcon(fileName);

        li.innerHTML = `<img src="${iconUrl}" style="width:18px; height:18px; margin-right:10px;"><span>${fileName}</span>`;
        
        li.onclick = () => {
            document.querySelectorAll('.file-item').forEach(i => i.classList.remove('active'));
            li.classList.add('active');
            currentFileNameDisplay.innerText = fileName;

            const editor = document.getElementById('editor');
            const imgPreview = document.getElementById('image-preview');
            const previewImg = document.getElementById('preview-img');
            const isAudio = fileName.endsWith('.mp3') || fileName.endsWith('.wav');
            const musicBar = document.getElementById('music-player-bar');
            const audio = document.getElementById('main-audio');
            const trackName = document.getElementById('track-name');
            const editorArea = document.querySelector('.code-editor-area');

            const isImage = /\.(png|jpg|jpeg|gif|webp|ico)$/i.test(fileName);

            if (isAudio) {
                musicBar.style.display = 'flex';
                editorArea.classList.add('shifted');
                lyricsContainer.style.display = 'block';
    
                audio.src = filesData[fileName];
                audio.play();
                } else {
                    if (musicBar.style.display === 'flex') {
                    editorArea.classList.add('shifted');
                }
            }

            if (isImage) {
                editor.style.display = 'none';
                imgPreview.style.display = 'flex';
                previewImg.src = filesData[fileName];
            } else {
                editor.style.display = 'block';
                imgPreview.style.display = 'none';
                editor.value = filesData[fileName] || "";
            }
        };
        fileList.appendChild(li);
    });
}

audio.ontimeupdate = () => {
    const lyricsText = document.getElementById('lyrics-text');
    if (!lyricsText) return; 

    const currentTime = Math.floor(audio.currentTime);
    
    const currentName = currentFileNameDisplay ? currentFileNameDisplay.innerText : "";

    if (currentName.includes("BeeePRO")) {
        if (currentTime >= 0 && currentTime < 5) lyricsText.innerText = "Dublikata Studio представляет...";
        else if (currentTime >= 5 && currentTime < 10) lyricsText.innerText = "Продавцы имбовые, залетаем на BeeePRO!";
        else if (currentTime >= 10 && currentTime < 15) lyricsText.innerText = "Лучший маркет в СНГ, это знают всё и всё!";
        else if (currentTime >= 15 && currentTime < 20) lyricsText.innerText = "Dublikata Studio на бите...";
        else lyricsText.innerText = "🔥🔥🔥";
    } else {
        lyricsText.innerText = "Слушаем: " + currentName;
    }
};

function getFileIcon(fileName) {
    const ext = fileName.split('.').pop().toLowerCase();
    const icons = {
        'html': 'https://img.icons8.com/color/24/html-5--v1.png',
        'css': 'https://img.icons8.com/color/24/css3.png',
        'js': 'https://img.icons8.com/color/24/javascript--v1.png',
        'txt': 'https://img.icons8.com/color/24/txt.png',
        'java': 'https://img.icons8.com/color/48/java-coffee-cup-logo.png',
        'png': 'https://img.icons8.com/color/24/image.png',
        'jpg': 'https://img.icons8.com/color/24/image.png',
        'apk': 'https://img.icons8.com/color/24/android-os.png',
        'json': 'https://img.icons8.com/color/24/json--v1.png'
    };
    return icons[ext] || 'https://img.icons8.com/color/24/file.png';
}

['dragover', 'dragenter'].forEach(eventName => {
    explorer.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        explorer.style.borderColor = "#007bff";
    });
});

['dragleave', 'drop'].forEach(eventName => {
    explorer.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        explorer.style.borderColor = "#1a1a1a";
    });
});

explorer.addEventListener('drop', (e) => {
    const files = e.dataTransfer.files;
    handleFiles(files);
});

function handleFiles(files) {
    for (let file of files) {
        const reader = new FileReader();
        
        reader.onload = (e) => {
            const data = e.target.result;

            filesData[file.name] = data;

            saveFileToDB(file.name, data); 
            
            renderFileList();
            console.log(`Файл ${file.name} успешно сохранен в DublikataDB!`);
        };

        if (file.type.startsWith('image/') || file.type.startsWith('audio/')) {
            reader.readAsDataURL(file);
        } else {
            reader.readAsText(file);
        }
    }
}

document.getElementById('real-file-input').addEventListener('change', (e) => {
    handleFiles(e.target.files);
});

editorTextArea.addEventListener('input', () => {
    const currentFile = currentFileNameDisplay.innerText.trim();
    if (currentFile && filesData.hasOwnProperty(currentFile)) {
        filesData[currentFile] = editorTextArea.value;
        saveFileToDB(currentFile, editorTextArea.value);
    }
});

const savedName = localStorage.getItem('dublikata_project_name');
if (savedName) projectInput.value = savedName;

if (projectInput) {
    projectInput.addEventListener('input', (e) => {
        const name = e.target.value.toUpperCase();
        localStorage.setItem('dublikata_project_name', name);

        const projectTitle = document.querySelector('.project-header h3');
        if (projectTitle) projectTitle.innerText = name;
    });
}

window.addEventListener('load', () => {
    const loader = document.getElementById('loader');

    renderFileList();
    const firstFile = Object.keys(filesData)[0];
    if (firstFile) {
        currentFileNameDisplay.innerText = firstFile;
        editorTextArea.value = filesData[firstFile];
    }

    setTimeout(() => {
        loader.classList.add('loader-hidden');
    }, 4500); 
});
</script>
</body>
</html>
