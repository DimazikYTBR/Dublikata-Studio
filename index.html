<!doctype html>
<html lang="en">
<head>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dublikata Studio</title>
  <link rel="stylesheet" href="css/style.css">
<style>
        body {
            font-family: 'Inter', -apple-system, sans-serif;
        }

        @font-face {
            font-family: 'Inter';
            src: url('./fonts/Inter.ttf') format('truetype');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }

        * { box-sizing: border-box; }

        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s;
            overflow: hidden;
        }

        .loader-content {
            text-align: center;
        }

        .studio-logo {
            color: #ffffff;
            font-size: 2.5rem;
            letter-spacing: 4px;
            margin-bottom: 20px;
            font-family: 'Inter', -apple-system, sans-serif;
            text-transform: uppercase;
            animation: fadeIn 1.5s ease-out;
        }

        .studio-logo span {
            color: #007bff;
        }

        .progress-bar-container {
            width: 400px;
            height: 4px;
            background: #1a1a1a;
            border-radius: 10px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }

        .progress-fill-XP {
            width: 50px;
            height: 100%;
            background: #007bff;
            border-radius: 10px;
            box-shadow: 0 0 15px #007bff, 0 0 5px white inset;
            position: absolute;
            left: -55px;
            animation: loadingXP 1.5s cubic-bezier(0.45, 0.05, 0.55, 0.95) forwards;
            animation-iteration-count: 3;
        }

        @keyframes loadingXP {
            0% { left: -110px; }
            100% { left: 100%; }
        }

        .loader-hidden {
            opacity: 0;
            visibility: hidden;
        }

        .main-content {
            padding: 20px;
            color: white;
            font-family: 'Inter', -apple-system, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
    </style>
</head>
<body style="background-color: #050505; margin: 0;">

    <div id="loader">
        <div class="loader-content">
            <h1 class="studio-logo">DUBLIKATA <span>STUDIO</span></h1>
            <div class="progress-bar-container">
                <div class="progress-fill-XP"></div>
            </div>
        </div>
    </div>

    <div class="main-content">
        <h1>Сайт Dublikata Studio запущен</h1>
        <p>Добро пожаловать в будущее разработки.</p>
    </div>

    <script>
        window.addEventListener('load', () => {
            const loader = document.getElementById('loader');

            setTimeout(() => {
                loader.classList.add('loader-hidden');
            }, 4500); 
        });
    </script>
</body>
</html>
