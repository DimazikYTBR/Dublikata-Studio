<!doctype html>
<html lang="en">
<head>
<link rel="apple-touch-icon" href="images/sapka.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dublikata</title>
  <link rel="stylesheet" href="css/style.css">
<style>
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .loader-content {
            text-align: center;
        }

        .studio-logo {
            color: #ffffff;
            font-family: 'Arial Black', sans-serif;
            font-size: 2rem;
            letter-spacing: 4px;
            margin-bottom: 20px;
            text-transform: uppercase;
            animation: fadeIn 1.5s ease-out;
        }

        .studio-logo span {
            color: #007bff;
        }

        .progress-bar {
            width: 200px;
            height: 2px;
            background: #1a1a1a;
            border-radius: 10px;
            margin: 0 auto;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #007bff;
            box-shadow: 0 0 15px #007bff;
            animation: loading 2s forwards cubic-bezier(0.42, 0, 0.58, 1);
        }

        @keyframes loading {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loader-hidden {
            opacity: 0;
            visibility: hidden;
        }
  
        .main-content {
            padding: 20px;
            color: white;
            font-family: sans-serif;
            text-align: center;
            margin-top: 50px;
        }
    </style>
</head>
<body style="background-color: #050505; margin: 0;">

    <div id="loader">
        <div class="loader-content">
            <h1 class="studio-logo">DUBLIKATA <span>STUDIO</span></h1>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>
    </div>

    <div class="main-content">
        <h1>Сайт Dublikata Studio запущен</h1>
        <p>Добро пожаловать в будущее разработки.</p>
    </div>

    <script>
        window.addEventListener('load', () => {
            const loader = document.getElementById('loader');

            setTimeout(() => {
                loader.classList.add('loader-hidden');
            }, 2200); 
        });
    </script>
</body>
</html>
